syntax = "proto3";
package live;

service LiveService {
  rpc CreateLive (CreateLiveRequest) returns (LiveResponse) {}
  rpc JoinLive (JoinLiveRequest) returns (JoinLiveResponse) {}
  rpc ShowRoom (ShowRoomRequest) returns (RoomResponse) {}
  rpc ChangeStatus (ChangeStatusRequest) returns (LiveResponse) {}
  rpc CmsList (CmsListRequest) returns (CmsListResponse) {}
  rpc CmsDetail (CmsDetailRequest) returns (RoomResponse) {}
  rpc DeleteLive (DeleteLiveRequest) returns (CommonResponse) {}
  rpc UpdateCode (UpdateCodeRequest) returns (UpdateCodeResponse) {}
  rpc UpdateLive (UpdateLiveRequest) returns (LiveResponse) {}
  rpc GetStudentRooms (GetStudentRoomsRequest) returns (StudentRoomsResponse) {}
  rpc LeaveRoom (LeaveRoomRequest) returns (CommonResponse) {}
  rpc BatchLeave (BatchLeaveRequest) returns (BatchLeaveResponse) {}
  rpc GetParticipants (GetParticipantsRequest) returns (ParticipantsResponse) {}
  rpc GenerateTransferCode (GenerateTransferCodeRequest) returns (GenerateTransferCodeResponse) {}
  rpc ExecuteTransfer (ExecuteTransferRequest) returns (CommonResponse) {}
  rpc SaveVideoRecording (SaveVideoRecordingRequest) returns (CommonResponse) {}
  rpc GetVideoList (GetVideoListRequest) returns (VideoListResponse) {}
  rpc GetVideoDetail (GetVideoDetailRequest) returns (VideoDetailResponse) {}
  rpc DeleteVideoByRoomIds (DeleteVideoByRoomIdsRequest) returns (CommonResponse) {}
  rpc DeleteVideoByVideoIds (DeleteVideoByVideoIdsRequest) returns (CommonResponse) {}
  rpc GetUserWatchTimeList (GetUserWatchTimeListRequest) returns (GetUserWatchTimeListResponse) {}
  rpc SaveCourseware (SaveCoursewareRequest) returns (CommonResponse) {}
  rpc ListCourseware (ListCoursewareRequest) returns (CoursewareListResponse) {}
  rpc DeleteCourseware (DeleteCoursewareRequest) returns (CommonResponse) {}
  rpc SaveBoardSnapshot (SaveBoardSnapshotRequest) returns (CommonResponse) {}
  rpc ListBoardSnapshots (ListBoardSnapshotsRequest) returns (BoardSnapshotListResponse) {}
  rpc GetBoardSnapshot (GetBoardSnapshotRequest) returns (BoardSnapshotDetailResponse) {}
  rpc GetLatestBoardSnapshot (GetLatestBoardSnapshotRequest) returns (BoardSnapshotDetailResponse) {}
  rpc CheckRoomAccess (CheckRoomAccessRequest) returns (CheckRoomAccessResponse) {}
  rpc CreateCheckin (CreateCheckinRequest) returns (CheckinSessionResponse) {}
  rpc RespondCheckin (RespondCheckinRequest) returns (RespondCheckinResponse) {}
  rpc EndCheckin (EndCheckinRequest) returns (CheckinSessionResponse) {}
  rpc OpenCheckinMakeup (OpenCheckinMakeupRequest) returns (CheckinSessionResponse) {}
  rpc GetCheckinState (GetCheckinStateRequest) returns (GetCheckinStateResponse) {}
  rpc ListCheckinSessions (ListCheckinSessionsRequest) returns (ListCheckinSessionsResponse) {}
  rpc GetCheckinRecords (GetCheckinRecordsRequest) returns (GetCheckinRecordsResponse) {}
  rpc GetTeacherStatistics (GetTeacherStatisticsRequest) returns (GetTeacherStatisticsResponse) {}
  rpc RecordToolUsage (RecordToolUsageRequest) returns (CommonResponse) {}
  rpc ModerateUser (ModerateUserRequest) returns (CommonResponse) {}
  rpc RecallMessage (RecallMessageRequest) returns (CommonResponse) {}
}

message CreateLiveRequest {
  string title = 1;
  int32 type = 2;
  int32 duration = 3;
  string live_user_id = 4;
  string start_time = 5;
  string room_id = 6;
}

message LiveResponse {
  string code = 1;
  string msg = 2;
  RoomData data = 3;
}

message RoomData {
  string room_id = 1;
  string title = 2;
  string speaker_name = 3;
  string join_code = 4;
  int32 status = 5;
  int32 type = 6;
  string start_time = 7;
  string teacher_code = 8;
  string student_code = 9;
  int32 duration = 10;
  string live_started_at = 11;
  string live_user_id = 12;
}

message JoinLiveRequest {
  string join_code = 1;
  string live_user_id = 2;
}

message JoinLiveResponse {
  string code = 1;
  string msg = 2;
  RoomData data = 3;
}

message ShowRoomRequest {
  string room_id = 1;
}

message RoomResponse {
  string code = 1;
  string msg = 2;
  RoomData data = 3;
}

message ChangeStatusRequest {
  string room_id = 1;
  int32 status = 2;
}

message CmsListRequest {
  int32 page = 1;
  int32 page_size = 2;
  int32 status = 3;
  string live_user_id = 4;
  string search_name = 5;
  string start_time = 6;
  string end_time = 7;
  int32 type = 8;
}

message CmsListResponse {
  string code = 1;
  string msg = 2;
  CmsListData data = 3;
}

message CmsListData {
  repeated RoomData items = 1;
  int32 total = 2;
}

message CmsDetailRequest {
  string room_id = 1;
}

message DeleteLiveRequest {
  string room_id = 1;
}

message UpdateCodeRequest {
  string room_id = 1;
}

message UpdateCodeResponse {
  string code = 1;
  string msg = 2;
  string join_code = 3;
}

message UpdateLiveRequest {
  string room_id = 1;
  string title = 2;
  int32 type = 3;
  string start_time = 4;
  int32 duration = 5;
}

message GetStudentRoomsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string cursor = 3;
}

message StudentRoomsResponse {
  string code = 1;
  string msg = 2;
  StudentRoomsData data = 3;
}

message StudentRoomsData {
  repeated RoomData items = 1;
  int32 total = 2;
}

message LeaveRoomRequest {
  string room_id = 1;
}

message BatchLeaveRequest {
  repeated string room_ids = 1;
}

message BatchLeaveResponse {
  string code = 1;
  string msg = 2;
}

message GetParticipantsRequest {
  string room_id = 1;
}

message ParticipantsResponse {
  string code = 1;
  string msg = 2;
  ParticipantsData data = 3;
}

message ParticipantsData {
  repeated Participant items = 1;
  int32 total = 2;
}

message Participant {
  string user_id = 1;
  string username = 2;
  string joined_at = 3;
}

message CommonResponse {
  string code = 1;
  string msg = 2;
}

message GenerateTransferCodeRequest {
  string room_id = 1;
  string target_user_id = 2;
}

message GenerateTransferCodeResponse {
  string code = 1;
  string msg = 2;
  string transfer_code = 3;
  string expires_at = 4;
}

message ExecuteTransferRequest {
  string room_id = 1;
  string transfer_code = 2;
  string from_user_id = 3;
}

message SaveVideoRecordingRequest {
  string room_id = 1;
  string file_path = 2;
  string file_name = 3;
  int64 file_size = 4;
  int32 duration = 5;
  int32 record_type = 6;
  string teacher_name = 7;
}

message GetVideoListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string live_user_id = 3;
  string search_name = 4;
  string start_time = 5;
  string end_time = 6;
  int32 type = 7;
  string cursor = 8;
}

message VideoListResponse {
  string code = 1;
  string msg = 2;
  VideoListData data = 3;
}

message VideoListData {
  repeated VideoListItem items = 1;
  int32 total = 2;
}

message VideoListItem {
  string room_id = 1;
  string title = 2;
  string teacher_name = 3;
  int32 type = 4;
  string start_time = 5;
  int32 count = 6;
}

message GetVideoDetailRequest {
  string room_id = 1;
  string start_time = 2;
  string end_time = 3;
}

message VideoDetailResponse {
  string code = 1;
  string msg = 2;
  VideoDetailData data = 3;
}

message VideoDetailData {
  repeated VideoDetailItem items = 1;
  int32 total = 2;
}

message VideoDetailItem {
  string id = 1;
  string room_id = 2;
  string file_path = 3;
  string file_name = 4;
  int64 file_size = 5;
  int32 duration = 6;
  int32 record_type = 7;
  string teacher_name = 8;
  string created_at = 9;
}

message DeleteVideoByRoomIdsRequest {
  repeated string room_ids = 1;
}

message DeleteVideoByVideoIdsRequest {
  repeated string video_ids = 1;
}

message GetUserWatchTimeListRequest {
  int32 page = 1;
  int32 page_size = 2;
  string room_id = 3;
  string search_name = 4;
  string cursor = 5;
}

message GetUserWatchTimeListResponse {
  string code = 1;
  string msg = 2;
  WatchTimeListData data = 3;
}

message WatchTimeListData {
  repeated WatchTimeItem items = 1;
  int32 total = 2;
  int32 total_time_by_room = 3;
}

message WatchTimeItem {
  string user_id = 1;
  string username = 2;
  int32 watch_time = 3;
  string joined_at = 4;
  string left_at = 5;
  bool is_online = 6;
}

message SaveCoursewareRequest {
  string room_id = 1;
  string filename = 2;
  string filext = 3;
  int64 filesize = 4;
  string fileurl = 5;
  string create_user_id = 6;
}

message ListCoursewareRequest {
  string room_id = 1;
}

message CoursewareListResponse {
  string code = 1;
  string msg = 2;
  CoursewareListData data = 3;
}

message CoursewareListData {
  repeated CoursewareItem items = 1;
  int32 total = 2;
}

message CoursewareItem {
  string id = 1;
  string room_id = 2;
  string filename = 3;
  string filext = 4;
  int64 filesize = 5;
  string fileurl = 6;
  string created_at = 7;
}

message DeleteCoursewareRequest {
  string id = 1;
}

message SaveBoardSnapshotRequest {
  string room_id = 1;
  string lesson_id = 2;
  int32 format_version = 3;
  bytes data = 4;
}

message ListBoardSnapshotsRequest {
  string room_id = 1;
  string cursor = 2;
  int32 limit = 3;
}

message BoardSnapshotListResponse {
  string code = 1;
  string msg = 2;
  BoardSnapshotListData data = 3;
}

message BoardSnapshotListData {
  repeated BoardSnapshotItem items = 1;
  bool has_more = 2;
}

message BoardSnapshotItem {
  string id = 1;
  string room_id = 2;
  string lesson_id = 3;
  int32 format_version = 4;
  int32 size = 5;
  string created_at = 6;
}

message GetBoardSnapshotRequest {
  string id = 1;
}

message GetLatestBoardSnapshotRequest {
  string room_id = 1;
}

message BoardSnapshotDetailResponse {
  string code = 1;
  string msg = 2;
  BoardSnapshotDetailData data = 3;
}

message BoardSnapshotDetailData {
  string id = 1;
  string room_id = 2;
  string lesson_id = 3;
  int32 format_version = 4;
  bytes data = 5;
  string created_at = 6;
}

message CheckRoomAccessRequest {
  string room_id = 1;
  string user_id = 2;
}

message CheckRoomAccessResponse {
  string code = 1;
  string msg = 2;
  CheckRoomAccessData data = 3;
}

message CheckRoomAccessData {
  bool allowed = 1;
  bool is_teacher = 2;
}

message CreateCheckinRequest {
  string room_id = 1;
  int32 duration = 2;
}

message RespondCheckinRequest {
  string room_id = 1;
  string session_id = 2;
  bool makeup = 3;
}

message EndCheckinRequest {
  string room_id = 1;
  string session_id = 2;
}

message OpenCheckinMakeupRequest {
  string room_id = 1;
  string session_id = 2;
}

message GetCheckinStateRequest {
  string room_id = 1;
}

message ListCheckinSessionsRequest {
  string room_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetCheckinRecordsRequest {
  string session_id = 1;
}

message CheckinSessionData {
  string session_id = 1;
  string room_id = 2;
  string teacher_id = 3;
  string started_at = 4;
  string deadline_at = 5;
  string ended_at = 6;
  int32 attendee_count = 7;
  int32 signed_count = 8;
  bool makeup_open = 9;
  int32 status = 10;
  bool my_signed = 11;
  int32 my_method = 12;
}

message CheckinSessionResponse {
  string code = 1;
  string msg = 2;
  CheckinSessionData data = 3;
}

message RespondCheckinResponse {
  string code = 1;
  string msg = 2;
  int32 signed_count = 3;
  bool already_signed = 4;
  bool makeup = 5;
}

message GetCheckinStateData {
  bool has_session = 1;
  bool is_owner = 2;
  CheckinSessionData session = 3;
}

message GetCheckinStateResponse {
  string code = 1;
  string msg = 2;
  GetCheckinStateData data = 3;
}

message ListCheckinSessionsData {
  repeated CheckinSessionData items = 1;
  int32 total = 2;
}

message ListCheckinSessionsResponse {
  string code = 1;
  string msg = 2;
  ListCheckinSessionsData data = 3;
}

message CheckinRecordItem {
  string user_id = 1;
  bool in_denominator = 2;
  bool signed = 3;
  int32 method = 4;
  string responded_at = 5;
}

message GetCheckinRecordsData {
  repeated CheckinRecordItem items = 1;
  int32 total = 2;
  int32 attendee_count = 3;
  int32 signed_count = 4;
  int32 attended_count = 5;
}

message GetCheckinRecordsResponse {
  string code = 1;
  string msg = 2;
  GetCheckinRecordsData data = 3;
}

message GetTeacherStatisticsRequest {
  string start_time = 1;
  string end_time = 2;
}

message StatisticsDayPoint {
  string date = 1;
  int64 seconds = 2;
  int32 person_times = 3;
  int32 viewers = 4;
}

message GetTeacherStatisticsData {
  int64 total_viewers = 1;
  int64 total_seconds = 2;
  int32 total_rooms = 3;
  bool has_data = 4;
  repeated StatisticsDayPoint series = 5;
}

message GetTeacherStatisticsResponse {
  string code = 1;
  string msg = 2;
  GetTeacherStatisticsData data = 3;
}

message RecordToolUsageRequest {
  string room_id = 1;
  string tool = 2;
}

message ModerateUserRequest {
  string room_id = 1;
  string user_id = 2;
  // mute | kick
  string kind = 3;
  // set | release
  string op = 4;
  // mute 生效时长（1/5/10 分钟）；kind=kick 时为 0
  int32 minutes = 5;
}

// F4 消息撤回：权限（发言者本人/房主）与 2 分钟窗在 live-service 裁决；
// 成功 code=0，msg='already_recalled' 表示幂等重复（网关据此跳过广播/审计）
message RecallMessageRequest {
  string room_id = 1;
  string msg_id = 2;
}
