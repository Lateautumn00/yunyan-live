name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit production dependencies (high+ blocks)
        run: node scripts/audit-gate.mjs
        env:
          AUDIT_REGISTRY: https://registry.npmjs.org

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 全历史扫描（gitleaks 默认 git 模式遍历提交）
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

      - name: Scan full git history
        run: /tmp/gitleaks detect --redact --no-banner --source .

  schema:
    name: Schema baseline gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # 与 db/schema-baseline.sql 生成环境同 minor 版本（见 db/README.md）
        image: postgres:16.15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yunyan_live_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yunyan_live_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Replay migration chain on empty database
        run: node scripts/db-migrate.mjs

      - name: Dump replayed schema
        run: |
          sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=postgres pg_dump -h localhost -U postgres -d yunyan_live_ci \
            --schema-only --no-owner --no-privileges --exclude-table=schema_migrations \
            > /tmp/replayed.sql

      - name: Gate - replayed schema must match db/schema-baseline.sql
        run: |
          ./scripts/normalize-schema-dump.sh db/schema-baseline.sql > /tmp/base.sql
          ./scripts/normalize-schema-dump.sh /tmp/replayed.sql > /tmp/got.sql
          diff -u /tmp/base.sql /tmp/got.sql

  tests:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # compose 插值必需项（${VAR:?}）；仅用于校验/构建，不部署
      RABBITMQ_USER: ci
      RABBITMQ_PASSWORD: ci-password
      GRPC_SHARED_SECRET: ci-shared-secret
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose -f init/docker-compose.yml config -q

      - name: Build service images
        run: >-
          docker compose -f init/docker-compose.yml --profile app build
          gateway auth-service live-service mail-service
          chat-ws-service yjs-ws-service
