services:
  postgres:
    image: postgres:16-alpine
    container_name: yunyan-live-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yunyan_live
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yunyan-live-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: yunyan-live-rabbitmq
    hostname: yunyan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  janus-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: yunyan-live-janus:latest
    container_name: janus-gateway
    restart: unless-stopped
    ports:
      - '8188:8188'
      - '8088:8088'
      - '20000-20100:20000-20100/udp'
    environment:
      - GATEWAY_IP=0.0.0.0
      - STUN_SERVER=stun.l.google.com
      - STUN_PORT=19302
      - RTP_PORT_RANGE=20000-20100
    volumes:
      - /home/janus/recordings:/tmp/janus/recordings
      - janus-logs:/var/log/janus

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  janus-logs:
