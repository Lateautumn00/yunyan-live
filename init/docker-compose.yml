services:
  postgres:
    image: postgres:16-alpine
    container_name: yunyan-live-postgres
    restart: unless-stopped
    networks: [edge, backend]
    environment:
      POSTGRES_DB: yunyan_live
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # 宿主双绑定：127.0.0.1 本机直连 + 192.168.2.100 跨机（Windows 侧 .env / 演练脚本）；不裸奔 0.0.0.0
      - '127.0.0.1:5432:5432'
      - '192.168.2.100:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 批次 5：直载 db/schema-baseline.sql（单一事实源，替代已封存的 init/schema.sql）
      - ../db/schema-baseline.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yunyan-live-redis
    restart: unless-stopped
    networks: [edge, backend]
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      # 宿主双绑定：同 postgres，跨机访问（mail/server/yjs 旧 .env 与跨机演练）走 192.168.2.100
      - '127.0.0.1:6379:6379'
      - '192.168.2.100:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: yunyan-live-rabbitmq
    hostname: yunyan-rabbitmq
    restart: unless-stopped
    networks: [edge, backend]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  janus-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: yunyan-live-janus:latest
    container_name: janus-gateway
    restart: unless-stopped
    networks: [edge, backend]
    ports:
      - '8188:8188'
      - '8088:8088'
      - '20000-20100:20000-20100/udp'
    environment:
      - GATEWAY_IP=0.0.0.0
      # 留空禁用 STUN（GFW 阻断 stun.l.google.com 会导致 janus 启动 FATAL 退出）
      - STUN_SERVER=${JANUS_STUN_SERVER:-}
      - STUN_PORT=19302
      - RTP_PORT_RANGE=20000-20100
    volumes:
      - ./entrypoint.sh:/entrypoint.sh:ro
      - /home/janus/recordings:/tmp/janus/recordings
      - janus-logs:/var/log/janus

  # ==== O3 业务服务（批次 5）：走 --profile app，缺省 `docker compose up` 仍只起基础设施 ====
  # 起停: docker compose --profile app up -d --build
  # 注意: 与宿主机 pnpm dev 同端口互斥（3001/50054/50055/9464-9466），二选一运行
  gateway:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    image: yunyan-live-server:latest
    container_name: yunyan-live-gateway
    profiles: ['app']
    restart: unless-stopped
    networks: [edge, backend]
    ports:
      - '127.0.0.1:3001:3001'
    environment:
      SERVER_PORT: '3001'
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/yunyan_live
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret}
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET:?}
      AUTH_GRPC_URL: auth-service:50051
      LIVE_GRPC_URL: live-service:50052
      MAIL_GRPC_URL: mail-service:50053
      JANUS_URL: http://janus-gateway:8088
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
      RECORDINGS_DIR: /home/janus/recordings
    volumes:
      # 与 janus-gateway 同宿主目录，保证录制文件两侧可见（宿主机路径随 init/.env 部署环境）
      - /home/janus/recordings:/home/janus/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
      live-service:
        condition: service_started
      mail-service:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  auth-service:
    build:
      context: ..
      dockerfile: apps/auth-service/Dockerfile
    image: yunyan-live-auth:latest
    container_name: yunyan-live-auth
    profiles: ['app']
    restart: unless-stopped
    networks: [backend]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/yunyan_live
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret}
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: '50051'
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET:?}
      MAIL_GRPC_URL: mail-service:50053
      METRICS_PORT: '9464'
    depends_on:
      postgres:
        condition: service_healthy
      mail-service:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:9464/metrics || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  live-service:
    build:
      context: ..
      dockerfile: apps/live-service/Dockerfile
    image: yunyan-live-live:latest
    container_name: yunyan-live-live
    profiles: ['app']
    restart: unless-stopped
    networks: [backend]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/yunyan_live
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret}
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: '50052'
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET:?}
      JANUS_URL: http://janus-gateway:8088
      TYPEORM_SYNC: 'false'
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
      METRICS_PORT: '9465'
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:9465/metrics || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  mail-service:
    build:
      context: ..
      dockerfile: apps/mail-service/Dockerfile
    image: yunyan-live-mail:latest
    container_name: yunyan-live-mail
    profiles: ['app']
    restart: unless-stopped
    networks: [backend, egress]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: '50053'
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET:?}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
      METRICS_PORT: '9466'
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:9466/metrics || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  chat-ws-service:
    build:
      context: ..
      dockerfile: apps/chat-ws-service/Dockerfile
    image: yunyan-live-chat-ws:latest
    container_name: yunyan-live-chat-ws
    profiles: ['app']
    restart: unless-stopped
    networks: [edge]
    ports:
      - '127.0.0.1:50054:50054'
    environment:
      CHAT_WS_PORT: '50054'
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/yunyan_live
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?}:${RABBITMQ_PASSWORD:?}@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://127.0.0.1:50054/metrics || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  yjs-ws-service:
    build:
      context: ..
      dockerfile: apps/yjs-ws-service/Dockerfile
    image: yunyan-live-yjs-ws:latest
    container_name: yunyan-live-yjs-ws
    profiles: ['app']
    restart: unless-stopped
    networks: [edge, backend]
    ports:
      - '127.0.0.1:50055:50055'
    environment:
      YJS_WS_PORT: '50055'
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      LIVE_GRPC_URL: live-service:50052
      GRPC_SHARED_SECRET: ${GRPC_SHARED_SECRET:?}
    depends_on:
      redis:
        condition: service_healthy
      live-service:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 50055 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # O5 监控最小集（批次 3 启动；演练与告警外发收尾在批次 5）
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: yunyan-live-prometheus
    restart: unless-stopped
    networks: [edge, backend]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: yunyan-live-alertmanager
    restart: unless-stopped
    networks: [edge]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - '127.0.0.1:9093:9093'
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: yunyan-live-node-exporter
    restart: unless-stopped
    networks: [edge]
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+)($$|/)'
    ports:
      - '127.0.0.1:9100:9100'
    volumes:
      - /:/host:ro

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  janus-logs:
  promdata:
  amdata:

# GAP-S10b 网络边界：
# - edge   正常桥接（可出网 + 宿主 loopback 端口发布）；仅边缘面服务与共享基础设施在列
# - backend internal: true（仅容器互访、无外网）；auth/live 等 gRPC 身份面只挂此网
# - egress 仅 mail-service：SMTP 出网专用，业务容器不可达 mail:50053
# 隔离目标：edge-only 容器（chat-ws/alertmanager/node-exporter）不可达 auth:50051 / live:50052
networks:
  edge:
  backend:
    internal: true
  egress:
