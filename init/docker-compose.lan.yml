# 跨机 LAN 绑定 overlay（仅 Linux 服务器使用）
#
# 本机开发（Docker Desktop/WSL）请勿叠加本文件——WSL 引擎无法绑定非回环宿主 IP，
# 会报 "cannot assign requested address" 导致容器起不来。本机直接 `docker compose up -d` 即可。
#
# 服务器部署（192.168.2.100，Linux docker 可绑任意本机 IP）：
#   docker compose -f docker-compose.yml -f docker-compose.lan.yml up -d --build
#
# LAN_IP 可在 .env 覆盖（默认 192.168.2.100 = 服务器静态地址）；
# 叠加后 pg/redis 同时监听回环（基础文件）+ LAN（本文件），服务/演练走 192.168.2.100:5432/6379。
services:
  postgres:
    ports:
      - '${LAN_IP:-192.168.2.100}:5432:5432'

  redis:
    ports:
      - '${LAN_IP:-192.168.2.100}:6379:6379'
