server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1000M;

    location / {
        try_files $uri $uri/ =404;
    }

    # Windows exe，弹出下载，关闭gzip
    location ~* \.exe$ {
        gzip off;
        add_header Content-Disposition "attachment";
        expires 1d;
        add_header Cache-Control "public";
    }

    # Mac dmg 安装包
    location ~* \.dmg$ {
        gzip off;
        add_header Content-Disposition "attachment";
        expires 1d;
        add_header Cache-Control "public";
    }

    # Linux AppImage 二进制包
    location ~* \.AppImage$ {
        gzip off;
        add_header Content-Disposition "attachment";
        expires 1d;
        add_header Cache-Control "public";
    }

    # yml、RELEASES 更新清单，electron-updater读取，不要attachment
    location ~* \.(yml|RELEASES)$ {
        gzip off;
        expires 10m;
        add_header Cache-Control "public";
    }

    # 网页类静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|html)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    error_page 404 /404.html;
}

