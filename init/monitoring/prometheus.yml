# O5 监控最小集 —— Prometheus 主配置
# 命名与值域约定见 docs/research/monitoring-baseline.md（job_name ≡ 指标 service label）
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # O3 容器化后：与业务服务同 compose 网络，直连服务名（批次 5 O5 收尾对齐；
  # 宿主机 pnpm dev 单跑时此配置不可达，见 monitoring-baseline §5 拓扑说明）
  - job_name: server
    static_configs:
      - targets: ['gateway:3001']

  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:9464']

  - job_name: live-service
    static_configs:
      - targets: ['live-service:9465']

  # F9：通知队列/发送结果（docs/research/notification-matrix.md）
  - job_name: mail-service
    static_configs:
      - targets: ['mail-service:9466']

  - job_name: chat-ws-service
    static_configs:
      - targets: ['chat-ws-service:50054']

  # 基础设施：磁盘/主机指标（DiskSpaceLow 告警数据源）
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
