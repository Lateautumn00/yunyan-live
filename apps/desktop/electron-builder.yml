appId: com.yunyan.live
productName: yunyan-live
copyright: 云砚直播
directories:
  output: dist-release
  buildResources: build
files:
  - out/**
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
publish:
  provider: generic
  url: https://your-update-server.example.com/h5/live/
win:
  icon: build/icons/icon.ico
  artifactName: ${productName}_setup_${version}.${ext}
  target:
    - nsis
nsis:
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 云砚直播
  perMachine: false
  oneClick: false
mac:
  icon: build/icons/icon.icns
  artifactName: ${productName}_setup_${version}.${ext}
  target:
    - dmg
dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file
linux:
  icon: build/icons
  artifactName: ${productName}_setup_${version}.${ext}
  target:
    - AppImage
