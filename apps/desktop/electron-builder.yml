appId: com.yunyan.live
productName: yunyan-live
copyright: 云砚直播
directories:
  output: dist-release
  buildResources: build
files:
  - out/**
  - '!src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
# 自动更新源（唯一真源）：打包时写入 resources/app-update.yml，运行时不再 setFeedURL。
# 发版前替换为真实更新目录地址，必须以 / 结尾；目录内放 latest.yml + 安装包 + .blockmap。
# 详见 docs/release/desktop-update.md
publish:
  provider: generic
  url: https://your-update-server.example.com/update/win/
win:
  icon: build/icons/icon.ico
  artifactName: ${productName}_setup_${version}.${ext}
  target:
    - nsis
nsis:
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 云砚直播
  perMachine: false
  oneClick: false
mac:
  icon: build/icons/icon.icns
  artifactName: ${productName}_setup_${version}.${ext}
  target:
    - dmg
dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file
linux:
  icon: build/icons
  artifactName: ${productName}_setup_${version}.${ext}
  target:
    - AppImage
